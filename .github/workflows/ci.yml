name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 xvfb
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: cd app && npm ci && npx tsc --noEmit && xvfb-run -a npm test
