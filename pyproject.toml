[project]
name = "fidus"
version = "0.1.0"
description = "Fidus: assistente de voz para desktop (núcleo no terminal)"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "keyring>=25",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
]

[project.scripts]
fidus = "fidus.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fidus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
